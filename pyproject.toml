[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokpress"
version = "0.1.0"
description = "A pure-Python, tokenizer-driven, rANS-entropy-coded lossless compressor for many small, schema-homogeneous records."
requires-python = ">=3.10"
dependencies = ["tiktoken>=0.5"]

[project.scripts]
tokpress = "tokpress.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tokpress"]
# NOTE: pretrained profile data lives in data/ at the project root (not
# under src/tokpress/), by request -- it is NOT bundled into a built wheel.
# tokpress only works from a repo checkout (incl. `pip install -e .`)
# unless TOKPRESS_DATA_DIR is set to point at a deployed copy of data/.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
