[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokpress"
version = "0.1.0"
description = "A pure-Python, tiktoken-tokenizer-driven, rANS-entropy-coded lossless compressor."
requires-python = ">=3.10"
dependencies = ["tiktoken>=0.5"]

[project.scripts]
tokpress = "tokpress.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tokpress"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
