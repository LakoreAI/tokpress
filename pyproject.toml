[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "tokpress"
version = "0.1.1"
description = "A tiktoken-tokenizer-driven, rANS-entropy-coded lossless compressor with a Rust core and a pure-Python fallback."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["tiktoken>=0.5"]
authors = [{ name = "Le Duc Minh" }]
keywords = ["compression", "rans", "entropy-coding", "tiktoken", "bpe", "lz77", "dictionary"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving :: Compression",
]

[project.urls]
Homepage = "https://github.com/LakoreAI/tokpress"
Repository = "https://github.com/LakoreAI/tokpress"

[project.scripts]
tokpress = "tokpress.cli:main"

[tool.maturin]
python-source = "src"
module-name = "tokpress._rs"
features = ["pyo3/extension-module"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (large-payload encode/round-trips, BPE training); excluded from the PR CI job",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
